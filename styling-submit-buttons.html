<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>styling-submit-buttons</title>
</head>
<style>
    input#submit {
color: #444444;
text-shadow: 0px 1px 1px #08dce4;
border-bottom: 2px solid #b2b2b2;
background-color: #0be9e5;
background: -webkit-gradient(linear, left top, 
left bottom, from(#beeae9), to(#a8cfce));
background: -moz-linear-gradient(top, #beeae9, #a8cfce);
background: -o-linear-gradient(top, #beeae9, #a8cfce);
background: -ms-linear-gradient(top, #beeae9, #a8cfce);}
input#submit:hover {
color: #333333;
border: 1px solid #a4a4a4;
border-top: 2px solid #b2b2b2;
background-color: #06dcf8;
background: -webkit-gradient(linear, left top, 
left bottom, from(#a8cfce), to(#07fcf8));
background: -moz-linear-gradient(top, #05f1ea, #03cfcc);
background: -o-linear-gradient(top, #06ddd6, #beeae9);
background: -ms-linear-gradient(top, #05f3eb, #beeae9);}
</style>
<body>
    <div class="box">
        <input type="sumit" value="Register">
    </div>

</body>
</html>
