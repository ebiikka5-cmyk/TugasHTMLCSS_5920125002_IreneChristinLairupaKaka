<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>elliptical-shapes</title>
</head>
<style>
    p.one {
border-top-left-radius: 80px 50px;-moz-border-radius-top-left: 80px 50px;-webkit-border-radius-top-left: 80px 50px;
border: 2px solid #d6336d;
width: 100px;
height: 100px;
margin: 20px;}
p.two {
border-radius: 1em 4em 1em 4em / 2em 1em 2em 1em;-moz-border-radius: 1em 4em 1em 4em
/ 2em 1em 2em 1em;-webkit-border-radius:  1em 4em 1em 4em
/ 2em 1em 2em 1em;
border: 2px solid #d6336d;
width: 100px;
height: 100px;
margin: 20px;}
p.three {
padding: 0px;
border-radius: 100px;-moz-border-radius: 100px;-webkit-border-radius: 100px;
border: 2px solid #d6336d;
width: 100px;
height: 100px;
margin: 20px;}
</style>
<body>
   <p class="one"></p>
<p class="two"></p>
<p class="three"></p> 
</body>
</html>
