<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hover-aktive-focus</title>
</head>
<style>
    input {
padding: 6px 10px 6px 10px;
border: 1px solid #665544;
color: #181717;}
input.submit:hover {
background-color: #16160d;}
input.submit:active {
background-color: rgb(17, 15, 17);}
input.text {
color: #0c0c0c;}
input.text:focus {
color: #000000;}
</style>
<body>
    <div class="box">
        <input type="text" class="text">
        <input type="sumit" class="sumit" value="sumit">
    </div>
</body>
</html>
