<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vertical-align</title>
</head>
<style>
    #six-months {
vertical-align: text-top;}
#one-year {
vertical-align: baseline;}
#two-years {
vertical-align: text-bottom;}
</style>
<body>
    <h1>Briard Life Stages</h1>
    <p id="six-months"><img src="img 1.jpeg" width="70" height="70">Six months</p>
    <p id="One years"><img src="img 2.jpeg" width="70" height="70">One years</p>
    <p id="Two years"><img src="img 3.jpeg" width="70" height="70">Two years</p>

</body>
</html>
