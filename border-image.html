<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>border-image</title>
</head>
<style>
    p.one { -moz-border-image: url("garis.jpeg") 
11 11 11 11 stretch; -webkit-border-image: url("garis.jpeg") 
11 11 11 11 stretch;
border-image: url("garis.jpeg") 
11 11 11 11 stretch;}
p.two {-moz-border-image: url("garis.jpeg") 
11 11 11 11 round; -webkit-border-image: url("garis.jpeg") 
11 11 11 11 round; 
border-image: url("garis.jpeg") 
11 11 11 11 round;}
</style>
<body>
    <p class="one"><img src="garis.jpeg" alt=""></p>
<p class="two"><img src="" alt=""></p>
<p class="three"></p>
</body>
</html>
